<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#0b0a0f;--panel:#17151d;--line:#2a2733;--red:#e50914;--tx:#f3f1f6;--mut:#a09bad;--sx:4.5vw}
*{box-sizing:border-box;margin:0}html,body{background:var(--bg);color:var(--tx);font:400 16px/1.4 Manrope,system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid #fff;outline-offset:3px;border-radius:5px}
header{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:26px;padding:16px var(--sx);background:linear-gradient(#000d,#0000);transition:background .3s}header.s{background:var(--bg)}
.logo{font:400 34px 'Bebas Neue',Impact,sans-serif;letter-spacing:2px;color:var(--red)}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}nav button{color:#d0cbd9;white-space:nowrap;font-weight:600;padding:6px 12px;border-radius:4px}nav button.on{color:#fff;font-weight:800}nav button:hover{color:#fff}
nav button:focus-visible,.btn:focus-visible,.rd:focus-visible,.ib:focus-visible,.chip:focus-visible{background:#fff;color:#000;outline:none}
#hero{position:relative;min-height:82vh;display:flex;align-items:flex-end;padding:0 var(--sx) 11vh;background:#000 center/cover}
#hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b0a0fe6 5%,#0b0a0f00 65%),linear-gradient(0deg,var(--bg) 2%,#0000 45%)}
#hero>div{position:relative;z-index:1;max-width:640px}.tag{font-weight:800;color:var(--mut);margin-bottom:8px}.tag b{color:var(--red);font:400 30px 'Bebas Neue';margin-right:6px}
#hero h1{font:400 clamp(44px,6.5vw,92px)/.95 'Bebas Neue',Impact,sans-serif;letter-spacing:1px;margin-bottom:14px}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-weight:600;margin-bottom:22px}.meta b{color:#6fd18c}
.btn{display:inline-flex;gap:8px;align-items:center;padding:13px 32px;border-radius:4px;font-weight:800;font-size:20px;margin:0 10px 8px 0}
.btn.p{background:#fff;color:#000}.btn.g{background:#6d6d6eb3}.btn.g:hover{background:#6d6d6e80}
main{padding:0 0 70px;margin-top:-5vh;position:relative;z-index:2}main.pad{padding-top:96px;margin:0}
.row{margin:26px 0}.row h2,.sh{font-size:20px;font-weight:800;padding:0 var(--sx);margin:0 0 8px;display:flex;align-items:center;gap:14px}.row h2 button{font-size:13px;color:var(--mut);font-weight:600;padding:2px 8px}.row h2 button:hover{color:#fff}
.sc{position:relative}.tr{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:16px var(--sx) 20px;scroll-padding:0 var(--sx);scrollbar-width:none}.tr::-webkit-scrollbar{display:none}
.ar{display:none;position:absolute;top:16px;bottom:30px;width:3.5vw;z-index:3;background:#000b;font-size:32px}.ar.l{left:0}.ar.r{right:0}html.m .sc:hover .ar{display:block}
.card{flex:0 0 auto;width:clamp(200px,19vw,330px);scroll-snap-align:start;text-align:left;transition:transform .2s}.card:hover,.card:focus-visible{transform:scale(1.07);z-index:5}
.th{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;background:var(--panel)}.th img{width:100%;height:100%;object-fit:cover;display:block}
.tv .th{background:linear-gradient(135deg,#25222f,#13111a)}.tv .th img{object-fit:contain;padding:16% 0}
.ch .th{display:grid;place-items:center;background:linear-gradient(135deg,#2b2736,#14121a)}.ch .th img{width:44%;height:auto;aspect-ratio:1;border-radius:50%;padding:0}
.gn .th{display:grid;place-items:center}.gn b{font:400 36px/1 'Bebas Neue';letter-spacing:1.5px;text-align:center;padding:0 12px}
.du{position:absolute;right:6px;bottom:6px;background:#000c;padding:1px 6px;border-radius:3px;font-size:12px;font-weight:700}
.lv{position:absolute;left:6px;top:6px;background:var(--red);padding:1px 7px;border-radius:3px;font-size:11px;font-weight:800}
.rk{position:absolute;left:8px;bottom:-8px;font:400 76px/1 'Bebas Neue';font-style:normal;color:#0009;-webkit-text-stroke:2px #fff}
.pb{position:absolute;left:0;right:0;bottom:0;height:4px;background:#fff4}.pb i{display:block;height:100%;background:var(--red)}
.ct{margin-top:7px;font-weight:600;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cs{color:var(--mut);font-size:13px}
.card.more .th{display:flex;align-items:center;justify-content:center;font-weight:800;border:2px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px 10px;padding:0 var(--sx);margin-bottom:26px}.grid .card{width:auto}
.vh{padding:0 var(--sx);margin:0 0 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}.vh h1{font:400 50px 'Bebas Neue',sans-serif;letter-spacing:1px}.vh img{width:56px;height:56px;border-radius:50%}
.ib{padding:9px 16px;border:1px solid var(--line);border-radius:4px;font-weight:600}.ib:hover{background:#fff2}.rd{background:var(--red);padding:10px 18px;border-radius:4px;font-weight:700}
.empty{max-width:520px;margin:20vh auto;text-align:center;padding:0 20px}.empty p{color:var(--mut);margin:10px 0 22px}.mut{color:var(--mut);padding:0 var(--sx)}
.sb{padding:0 var(--sx) 20px}#q{width:100%;background:#000;border:2px solid var(--line);border-radius:6px;padding:14px 16px;font-size:20px}#q:focus{border-color:#fff;outline:none}
.set{max-width:780px;margin:0 auto}.set section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px;margin:0 var(--sx) 18px}
.set h3{font-size:18px;margin-bottom:8px}.set label{display:block;color:var(--mut);font-size:14px;margin:8px 0 4px}
.f{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}.f input{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:12px}.f input:focus{border-color:#fff;outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{padding:4px 12px;border:1px solid var(--line);border-radius:20px;font-size:13px}
.li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}.li img{width:32px;height:32px;border-radius:50%;object-fit:cover}.li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md{position:fixed;inset:0;z-index:50;background:#000;display:none}.md.on{display:block}
#pl .in{width:100%;height:100%;position:relative}#ytw,#ytw iframe{position:absolute;inset:0;width:100%;height:100%;border:0}#sh{position:absolute;inset:0;z-index:3}
#ov{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:80px var(--sx) 4vh;background:linear-gradient(#0000,#000e);transition:opacity .3s}#ov.h{opacity:0;pointer-events:none}
.top{display:flex;gap:16px;align-items:center;margin-bottom:14px}.top h3{flex:1;font-size:26px}
#bar{height:6px;background:#fff4;border-radius:3px}#bar i{display:block;height:100%;width:0;background:var(--red);border-radius:3px}
#tm{display:flex;justify-content:space-between;gap:20px;margin-top:10px;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:6px;font-weight:700;z-index:99;display:none}
@media(max-width:700px){header{gap:10px}.logo{font-size:26px}.btn{padding:10px 20px;font-size:16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.chip.on:not(:focus-visible){background:var(--red);border-color:var(--red)}
/* standard (desktop / phone): native player controls, close button stays visible */
html:not(.tv) #sh,html:not(.tv) #bar,html:not(.tv) #tm{display:none}
html:not(.tv) #ov{top:0;bottom:auto;padding:14px var(--sx) 50px;background:linear-gradient(#000c,#0000);pointer-events:none}
html:not(.tv) #ov .top{margin:0}html:not(.tv) #ov .top h3{font-size:18px}html:not(.tv) #ov .top button{pointer-events:auto;background:#000a}
/* ===== Android TV mode: auto-detected, adds html.tv (10-foot UI, overscan-safe, D-pad focus) ===== */
html.tv{--sx:5vw}html.tv:not(.m) *{cursor:none!important}html.tv body{font-size:20px}
html.tv header{padding:3vh var(--sx) 2vh}html.tv .logo{font-size:44px}html.tv nav{gap:10px}html.tv nav button{font-size:21px;padding:8px 18px}
html.tv .ar,html.tv [data-back],html.tv [data-close]{display:none!important}
html.tv .card{width:clamp(260px,20vw,420px);transition:transform .15s}html.tv .card:hover{transform:none}
html.tv .card:focus-visible{transform:scale(1.1);outline:4px solid #fff;outline-offset:3px;box-shadow:0 12px 40px #000c}
html.tv .ct{font-size:19px}html.tv .cs{font-size:16px}html.tv .row h2,html.tv .sh{font-size:26px}html.tv .row h2 button{font-size:17px;padding:6px 14px}
html.tv .tr{padding-top:26px;padding-bottom:34px}html.tv main{padding-bottom:6vh}
html.tv #hero{min-height:88vh;padding-bottom:14vh}html.tv .btn{font-size:24px;padding:16px 38px}html.tv .meta{font-size:19px}
html.tv .vh h1{font-size:64px}html.tv .set section{padding:26px}html.tv .set h3{font-size:24px}html.tv .set label{font-size:18px}
html.tv .chip{font-size:18px;padding:8px 16px}html.tv .f input{font-size:20px;padding:14px}html.tv .ib,html.tv .rd{font-size:19px;padding:13px 22px}html.tv #q{font-size:26px}
html.tv #toast{font-size:20px;bottom:6vh}
</style></head><body>
<header id="hd"><span class="logo">SAISTREAM</span><nav id="nav"></nav></header>
<div id="app"></div>
<div class="md" id="pl"><div class="in"><div id="ytw"></div><div id="sh"></div><div id="ov"><div class="top"><h3 id="pt"></h3><button class="ib" data-close>✕ Close</button></div><div id="bar"><i id="bi"></i></div><div id="tm"><span id="tc"></span><span id="hint"></span><span id="td"></span></div></div></div></div>
<div id="toast"></div>
<script>
const DEFAULT_KEY='AIzaSyCplczOfz3jzqtO0iyu4kZNro1b80xcnww'; // used when no key has been saved in Settings
const PRESET={channels:['UCP9WiuAlkJo2EMCl8dBUgLw','UCoJ0_TRpXzOfKJR3dllhTlg'],tvs:[]}; // channel IDs, and TVs as ["Name","youtube link","Category"]
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{toast('Browser storage is full')}}};
let cfg={key:'',channels:[],tvs:[],cats:{},...ls.get('ss_cfg',{})},data=ls.get('ss_data',{}),pos=ls.get('ss_pos',{}),hist=ls.get('ss_hist',[]);
cfg.key=cfg.key||DEFAULT_KEY;cfg.mode=cfg.mode||'auto';
/* TV auto-detection: Android TV / Google TV / Fire TV / Shield / smart-TV browsers, or an Android device with no touch screen. Override with Settings > Display or ?tv=1 / ?tv=0 */
const detectTV=()=>{const q=new URLSearchParams(location.search).get('tv');if(q==='1')return true;if(q==='0')return false;if(cfg.mode==='tv')return true;if(cfg.mode==='std')return false;
 const u=navigator.userAgent;return /Android ?TV|GoogleTV|Google TV|SmartTV|SMART-TV|AFT[A-Z]|BRAVIA|SHIELD|MiTV|Mi ?Box|Tizen|Web0S|WebOS|HbbTV|CrKey|Roku|NetCast/i.test(u)||(/Android/.test(u)&&!/Mobile/.test(u)&&!navigator.maxTouchPoints)||matchMedia('(pointer:none)').matches};
const isTV=()=>document.documentElement.classList.contains('tv'),applyMode=()=>document.documentElement.classList.toggle('tv',detectTV());applyMode();
let view='home',stack=[],gN=60,vmap={},feat=null,cur=null,P=null,timer,tick,ovT,lastKey=null,qs={},sq='';
const saveCfg=()=>ls.set('ss_cfg',cfg),saveData=()=>ls.set('ss_data',data);
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3200)}
const fmt=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0')};
const dur=s=>{const m=/P(?:(\d+)D)?T?(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s||'')||[];return(+m[1]||0)*86400+(+m[2]||0)*3600+(+m[3]||0)*60+(+m[4]||0)};
const thumb=(id,q='mqdefault')=>`https://i.ytimg.com/vi/${id}/${q}.jpg`,byDate=(a,b)=>b.p.localeCompare(a.p),hue=s=>[...s].reduce((a,c)=>a*31+c.charCodeAt(0),7)%360;
const GN={1:'Film',2:'Autos',10:'Music',15:'Pets',17:'Sports',19:'Travel',20:'Gaming',22:'People & Blogs',23:'Comedy',24:'Entertainment',25:'News',26:'Lifestyle',27:'Education',28:'Science & Tech',29:'Nonprofits'};
const DEF=['Entertainment','Music','News','Education','Sports','Kids','Faith','Lifestyle','Gaming','General'];
/* ---------- YouTube Data API ---------- */
async function api(ep,p){const r=await fetch('https://www.googleapis.com/youtube/v3/'+ep+'?'+new URLSearchParams({...p,key:cfg.key}));const j=await r.json();if(j.error)throw new Error(j.error.message);return j}
async function pages(ep,p,cb){let t;do{const j=await api(ep,t?{...p,pageToken:t}:p);await cb(j);t=j.nextPageToken}while(t)}
const icon=c=>(c.thumbnails.medium||c.thumbnails.default).url;
async function loadChannel(id,say){
 const c=(await api('channels',{part:'snippet,contentDetails',id,fields:'items(snippet(title,thumbnails),contentDetails/relatedPlaylists/uploads)'})).items?.[0];
 if(!c)throw new Error('No channel found for '+id);
 const ids=[],vids={},cc={};
 await pages('playlistItems',{part:'contentDetails',playlistId:c.contentDetails.relatedPlaylists.uploads,maxResults:50,fields:'nextPageToken,items/contentDetails/videoId'},j=>{j.items.forEach(i=>ids.push(i.contentDetails.videoId));say(`${c.snippet.title}: found ${ids.length} videos`)});
 for(let i=0;i<ids.length;i+=50){
  const j=await api('videos',{part:'snippet,contentDetails,statistics',id:ids.slice(i,i+50).join(','),fields:'items(id,snippet(title,publishedAt,liveBroadcastContent,categoryId),contentDetails/duration,statistics/viewCount)'});
  j.items.forEach(v=>{const d=dur(v.contentDetails.duration);if(d&&v.snippet.liveBroadcastContent==='none'){vids[v.id]={id:v.id,t:v.snippet.title,d,p:v.snippet.publishedAt,v:+v.statistics?.viewCount||0,c:id};cc[v.snippet.categoryId]=(cc[v.snippet.categoryId]||0)+1}});
  say(`${c.snippet.title}: loaded details for ${Math.min(i+50,ids.length)}/${ids.length}`)}
 const pl=[];
 await pages('playlists',{part:'snippet',channelId:id,maxResults:50,fields:'nextPageToken,items(id,snippet/title)'},async j=>{
  for(const p of j.items){const l=[];await pages('playlistItems',{part:'contentDetails',playlistId:p.id,maxResults:50,fields:'nextPageToken,items/contentDetails/videoId'},k=>k.items.forEach(i=>l.push(i.contentDetails.videoId)));
   const v=l.filter(x=>vids[x]);if(v.length)pl.push({id:p.id,t:p.snippet.title,v});say(`${c.snippet.title}: playlist “${p.snippet.title}”`)}});
 const top=Object.keys(cc).sort((a,b)=>cc[b]-cc[a])[0];
 data[id]={id,t:c.snippet.title,i:icon(c.snippet),g:GN[top]||'General',v:Object.values(vids).sort(byDate),pl,ts:Date.now()};
 saveData();index()}
function index(){vmap={};Object.values(data).forEach(c=>c.v.forEach(v=>vmap[v.id]=v))}
async function parseTV(u,name){
 u=u.trim();let o,m;
 if(m=u.match(/UC[\w-]{22}/))o={k:'c',id:m[0]};
 else if(m=u.match(/@[\w.-]+/)){const j=await api('channels',{part:'id',forHandle:m[0],fields:'items/id'});if(!j.items?.length)throw new Error('Handle not found');o={k:'c',id:j.items[0].id}}
 else if(m=u.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([\w-]{11})/)||u.match(/^([\w-]{11})$/))o={k:'v',id:m[1]};
 else throw new Error('Could not read that link. Use a YouTube live link, video ID, channel ID or @handle.');
 let cid=o.id,title=name;
 if(o.k==='v'){const s=(await api('videos',{part:'snippet',id:o.id,fields:'items/snippet(channelId,channelTitle)'})).items?.[0];if(!s)throw new Error('Video not found');cid=s.snippet.channelId;title=title||s.snippet.channelTitle}
 const c=(await api('channels',{part:'snippet',id:cid,fields:'items/snippet(title,thumbnails)'})).items?.[0];
 return{n:title||c?.snippet.title||'TV',k:o.k,id:o.id,i:c?icon(c.snippet):''}}
/* ---------- Categories ---------- */
const chIds=()=>cfg.channels.filter(c=>data[c]),catOf=id=>cfg.cats[id]||data[id]?.g||'General',tvCat=t=>t.c||'General';
const byCat=c=>chIds().filter(i=>catOf(i)===c),chCats=()=>[...new Set(chIds().map(catOf))].sort();
const exCats=()=>[...new Set([...chIds().map(catOf),...cfg.tvs.map(tvCat)])].sort();
const choices=()=>[...new Set([...DEF,...exCats()])];
/* ---------- Player ---------- */
let ytp;const ytReady=()=>ytp||(ytp=new Promise(r=>{if(window.YT?.Player)return r();window.onYouTubeIframeAPIReady=r;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)}));
function savePos(){if(!P||!cur||cur.tv||!P.getCurrentTime)return;try{const t=P.getCurrentTime(),d=P.getDuration()||vmap[cur.id].d;if(t>1)pos[cur.id]={t,d,ts:Date.now()};ls.set('ss_pos',pos)}catch{}}
function stop(){savePos();clearInterval(timer);clearInterval(tick);clearTimeout(ovT);try{P&&P.destroy()}catch{}P=null;$('#ytw').innerHTML=''}
function closeP(){stop();cur=null;$('#pl').classList.remove('on');render()}
function showOv(keep){const o=$('#ov');o.classList.remove('h');clearTimeout(ovT);if(!keep&&isTV())ovT=setTimeout(()=>o.classList.add('h'),4000)}
function playTV(i){const t=cfg.tvs[i];if(!t)return;stop();cur={tv:1,i};$('#pt').textContent=t.n+'  ·  LIVE';$('#pl').classList.add('on');
 $('#bar').style.visibility='hidden';$('#tc').textContent=$('#td').textContent='';$('#hint').textContent='▲ ▼ change channel · Back to exit';showOv();
 $('#ytw').innerHTML=`<iframe allow="autoplay;encrypted-media;fullscreen" allowfullscreen src="https://www.youtube.com/embed/${t.k==='c'?'live_stream?channel='+t.id+'&':t.id+'?'}autoplay=1&controls=${isTV()?0:1}&disablekb=${isTV()?1:0}&rel=0&playsinline=1"></iframe>`;tick=setInterval(updOv,500)}
function play(id,q){const v=vmap[id];if(!v)return;stop();cur={id,q:q||[]};$('#pt').textContent=v.t;$('#pl').classList.add('on');$('#bar').style.visibility='';
 $('#hint').textContent='◀ ▶ seek 10s · OK play/pause'+(cur.q.length>1?' · ▼ next video':'')+' · Back to exit';showOv();
 const p=pos[id],start=p&&p.t<p.d-20?Math.floor(p.t):0;hist=[id,...hist.filter(x=>x!==id)].slice(0,300);ls.set('ss_hist',hist);
 $('#ytw').innerHTML='<div id="yt"></div>';
 ytReady().then(()=>{if(!cur||cur.id!==id)return;P=new YT.Player('yt',{width:'100%',height:'100%',videoId:id,playerVars:{autoplay:1,start,rel:0,playsinline:1,controls:isTV()?0:1,disablekb:isTV()?1:0,fs:isTV()?0:1,iv_load_policy:3,modestbranding:1},events:{
  onStateChange:e=>{if(e.data===1){clearInterval(timer);timer=setInterval(savePos,4000);showOv()}else if(e.data===2)savePos();else if(e.data===0){delete pos[id];ls.set('ss_pos',pos);next()}},
  onError:()=>toast('This video cannot be embedded, or the app is not served over http(s)')}})});tick=setInterval(updOv,500)}
function next(){if(!cur||!cur.q.length)return;const i=cur.q.indexOf(cur.id);if(i>=0&&cur.q[i+1])play(cur.q[i+1],cur.q)}
function updOv(){const a=document.activeElement;if(a&&a.tagName==='IFRAME'){window.focus();a.blur()}
 if(!cur||cur.tv||!P||!P.getCurrentTime)return;try{const t=P.getCurrentTime(),d=P.getDuration()||0;$('#bi').style.width=d?t/d*100+'%':'0';$('#tc').textContent=fmt(t);$('#td').textContent=d?fmt(d):'';if(P.getPlayerState()===2)showOv(true)}catch{}}
function pKey(k){if(k==='Back'){closeP();return}
 if(cur.tv){const n=cfg.tvs.length;if(k==='D'||k==='NEXT')playTV((cur.i+1)%n);else if(k==='U'||k==='PREV')playTV((cur.i-1+n)%n);else showOv();return}
 if(!P||!P.seekTo)return;try{
  if(k==='L'||k==='RW')P.seekTo(Math.max(0,P.getCurrentTime()-10),true);
  else if(k==='R'||k==='FF')P.seekTo(P.getCurrentTime()+10,true);
  else if(k==='OK'||k==='PP')P.getPlayerState()===1?P.pauseVideo():P.playVideo();
  else if(k==='D'||k==='NEXT'){next();return}
  else if(k==='PREV'){const i=cur.q.indexOf(cur.id);if(i>0)play(cur.q[i-1],cur.q);return}}catch{}
 showOv();updOv()}
$('#sh').onclick=()=>pKey('OK');
/* ---------- Cards and rows ---------- */
const card=(v,q,rk)=>{const p=pos[v.id],ch=data[v.c];return`<button class="card" data-v="${v.id}" data-q="${q}"><div class="th"><img loading="lazy" src="${thumb(v.id)}" alt=""><span class="du">${fmt(v.d)}</span>${rk?`<i class="rk">${rk}</i>`:''}${p&&p.d?`<div class="pb"><i style="width:${Math.min(100,p.t/p.d*100)}%"></i></div>`:''}</div><div class="ct">${esc(v.t)}</div><div class="cs">${esc(ch?.t||'')} · ${v.p.slice(0,4)}</div></button>`};
const tvCard=(t,i)=>`<button class="card tv" data-tv="${i}"><div class="th">${t.i?`<img src="${esc(t.i)}" alt="">`:''}<span class="lv">LIVE</span></div><div class="ct">${esc(t.n)}</div></button>`;
const tvH=(c,f)=>cfg.tvs.map((t,i)=>(!c||tvCat(t)===c)&&(!f||f(t))?tvCard(t,i):'').join('');
const chCard=id=>{const d=data[id];return`<button class="card ch" data-go="ch:${id}"><div class="th"><img src="${esc(d.i)}" alt=""></div><div class="ct">${esc(d.t)}</div><div class="cs">${d.v.length} videos · ${d.pl.length} playlists</div></button>`};
const gnCard=c=>{const n=byCat(c).length,t=cfg.tvs.filter(x=>tvCat(x)===c).length,h=hue(c);return`<button class="card gn" data-go="cat:${esc(c)}"><div class="th" style="background:linear-gradient(135deg,hsl(${h} 55% 32%),hsl(${(h+50)%360} 60% 12%))"><b>${esc(c)}</b></div><div class="cs">${n} channels${t?' · '+t+' live':''}</div></button>`};
const plCard=(cid,i)=>{const p=data[cid].pl[i];return`<button class="card" data-go="pl:${cid}:${i}"><div class="th"><img loading="lazy" src="${thumb(p.v[0])}" alt=""><span class="du">${p.v.length} videos</span></div><div class="ct">${esc(p.t)}</div></button>`};
const row=(t,h,go)=>h?`<section class="row"><h2>${esc(t)}${go?`<button data-go="${esc(go)}">See all ›</button>`:''}</h2><div class="sc"><button class="ar l" aria-label="Scroll left">‹</button><div class="tr">${h}</div><button class="ar r" aria-label="Scroll right">›</button></div></section>`:'';
const vr=(t,l,go,rk)=>{if(!l.length)return'';const k='r'+Object.keys(qs).length;qs[k]=l.map(v=>v.id);return row(t,l.slice(0,isTV()?20:30).map((v,i)=>card(v,k,rk&&i+1)).join(''),go)};
const more=(n,k)=>n>gN?`<button class="card more" data-more="${k}"><div class="th">Show ${Math.min(60,n-gN)} more</div></button>`:'';
const vgrid=(l,k)=>{qs[k]=l.map(v=>v.id);return l.length?`<div class="grid">${l.slice(0,gN).map(v=>card(v,k)).join('')}${more(l.length,k)}</div>`:'<p class="mut">Nothing here yet.</p>'};
const vh=(t,sub,img,bk)=>`<div class="vh">${bk?'<button class="ib" data-back>‹ Back</button>':''}${img?`<img src="${esc(img)}" alt="">`:''}<h1>${esc(t)}</h1><span class="cs">${esc(sub||'')}</span></div>`;
const sec=(t,h)=>h?`<h2 class="sh">${t}</h2><div class="grid">${h}</div>`:'';
function pickFeat(){const all=Object.values(vmap);if(!all.length)return null;if(feat&&vmap[feat])return vmap[feat];
 let pool=all.filter(v=>v.d>=1500);if(pool.length<3)pool=all;pool=pool.sort((a,b)=>b.v-a.v).slice(0,8);const v=pool[Math.floor(Math.random()*pool.length)];feat=v.id;return v}
function hero(){const v=pickFeat();if(!v)return'';const p=pos[v.id],ch=data[v.c];
 return`<div id="hero" style="background-image:url(${thumb(v.id,'maxresdefault')}),url(${thumb(v.id,'hqdefault')})"><div><div class="tag"><b>S</b>Featured in ${esc(catOf(v.c))}</div><h1>${esc(v.t)}</h1><div class="meta"><b>${v.v.toLocaleString()} views</b><span>${esc(ch?.t)}</span><span>${v.p.slice(0,4)}</span><span>${fmt(v.d)}</span></div><button class="btn p" data-v="${v.id}" data-q="">▶ ${p&&p.t>5?'Resume at '+fmt(p.t):'Play'}</button><button class="btn g" data-go="ch:${v.c}">ⓘ More info</button><button class="btn g" id="shuf" aria-label="Another pick">⟳</button></div></div>`}
const NAV=[['home','Home'],['explore','Explore'],['channels','Channels'],['live','Live TV'],['hist','History'],['search','Search'],['settings','Settings']];
function nav(){const t=view.split(':')[0],a={cat:'explore',ch:'channels',pl:'channels',recent:'home'}[t]||t;$('#nav').innerHTML=NAV.map(([k,l])=>`<button data-go="${k}" class="${a===k?'on':''}">${l}</button>`).join('')}
/* ---------- Views ---------- */
function render(){
 qs={};nav();const A=$('#app'),V=view,L=Object.values(vmap);let h='';
 if(V==='home'){
  if(!chIds().length&&!cfg.tvs.length){A.innerHTML=`<div class="empty"><div class="logo" style="font-size:64px">SAISTREAM</div><p>Your library is empty. Add your YouTube API key, then channels and live TV.</p><button class="btn p" data-go="settings">Set up SaiStream</button></div>`;return afterRender()}
  const cont=hist.filter(id=>vmap[id]&&pos[id]&&pos[id].t>5&&pos[id].t<pos[id].d-20).map(id=>vmap[id]);
  h=hero()+'<main>'+vr('Continue watching',cont,'hist')+row('Live now',tvH(),'live')+vr('Recently added',[...L].sort(byDate),'recent')+vr('Top 10 on SaiStream',[...L].sort((a,b)=>b.v-a.v).slice(0,10),'',1)+row('Browse genres',exCats().map(gnCard).join(''),'explore')+chCats().map(c=>row(c,byCat(c).map(chCard).join(''),'cat:'+c)).join('')+'</main>'}
 else if(V==='explore')h=`<main class="pad">${vh('Explore','Pick a genre to see its channels')}<div class="grid">${exCats().map(gnCard).join('')}</div></main>`;
 else if(V.startsWith('cat:')){const c=V.slice(4);h=`<main class="pad">${vh(c,byCat(c).length+' channels',0,1)}<div class="grid">${byCat(c).map(chCard).join('')}${tvH(c)}</div></main>`}
 else if(V==='channels')h=`<main class="pad">${vh('Channels','Available channels by category')}${chCats().map(c=>row(c,byCat(c).map(chCard).join(''),'cat:'+c)).join('')||'<p class="mut">No channels yet. Add some in Settings.</p>'}</main>`;
 else if(V.startsWith('ch:')){const d=data[V.slice(3)];if(!d){view='home';return render()}
  h=`<main class="pad">${vh(d.t,d.v.length+' videos · '+catOf(d.id),d.i,1)}${d.pl.length?`<h2 class="sh">Playlists</h2><div class="grid">${d.pl.map((p,i)=>plCard(d.id,i)).join('')}</div>`:''}${vr('Latest uploads',d.v,'pl:'+d.id+':-1')}</main>`}
 else if(V.startsWith('pl:')){const[,id,i]=V.split(':'),d=data[id];if(!d){view='home';return render()}
  const l=+i<0?d.v:d.pl[+i].v.map(x=>vmap[x]).filter(Boolean);h=`<main class="pad">${vh(+i<0?'All uploads':d.pl[+i].t,d.t,d.i,1)}${vgrid(l,'g')}</main>`}
 else if(V==='live')h=`<main class="pad">${vh('Live TV','Streaming now')}${[...new Set(cfg.tvs.map(tvCat))].sort().map(c=>row(c,tvH(c))).join('')||'<p class="mut">No live channels yet. Add some in Settings.</p>'}</main>`;
 else if(V==='recent')h=`<main class="pad">${vh('Recently added','',0,1)}${vgrid([...L].sort(byDate),'g')}</main>`;
 else if(V==='hist'){const l=hist.filter(x=>vmap[x]).map(x=>vmap[x]);h=`<main class="pad">${vh('Watch history',l.length+' videos')}${l.length?`<div class="f" style="padding:0 var(--sx)"><button class="ib" id="chh">Clear watch history</button></div>${vgrid(l,'g')}`:'<p class="mut">Nothing watched yet. Videos you play will show up here.</p>'}</main>`}
 else if(V==='search')h=`<main class="pad"><div class="sb"><input id="q" type="search" placeholder="Search channels, playlists, live TV and videos" aria-label="Search" value="${esc(sq)}"></div><div id="sr"></div></main>`;
 else if(V==='settings'){const cp=()=>`<div class="chips">${choices().map(c=>`<button class="chip" data-cc="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;
  h=`<main class="pad"><div class="set">${vh('Settings','Set up your system')}
<section><h3>YouTube API key</h3><label>YouTube Data API v3 key. Stored only in this browser.</label><div class="f"><input id="key" type="password" value="${esc(cfg.key)}" placeholder="AIza..."><button class="rd" id="sk">Save key</button><button class="ib" id="tk">Test key</button></div></section>
<section><h3>Channels</h3><label>Channel ID (starts with UC) or a youtube.com/channel/ link</label><div class="f"><input id="chi" placeholder="UCxxxxxxxxxxxxxxxxxxxxxx"></div><label>Category (leave blank to detect it automatically)</label><div class="f"><input class="cin" id="cci" placeholder="e.g. Music"><button class="rd" id="ac">Add channel</button></div>${cp()}<div id="chl"></div><div class="f" style="margin-top:10px"><button class="ib" id="rf">Refresh all channels</button></div></section>
<section><h3>Live TV</h3><label>Name (optional) and a YouTube live link, video ID, channel ID or @handle</label><div class="f"><input id="tvn" placeholder="Name"></div><div class="f"><input id="tvu" placeholder="https://www.youtube.com/watch?v=..."></div><label>Category</label><div class="f"><input class="cin" id="tcc" placeholder="e.g. News"><button class="rd" id="at">Add live TV</button></div>${cp()}<div id="tvl"></div></section>
<section><h3>Display</h3><label>Auto-detect uses the TV layout on Android TV, Google TV, Fire TV and smart-TV browsers. Showing now: ${isTV()?'TV layout':'standard layout'}.</label><div class="chips">${[['auto','Auto-detect'],['tv','TV mode'],['std','Standard']].map(([k,l])=>`<button class="chip${cfg.mode===k?' on':''}" data-mode="${k}">${l}</button>`).join('')}</div></section>
<section><h3>Library</h3><div class="f"><button class="ib" data-go="hist">Watch history</button><button class="ib" id="chh">Clear watch history</button><button class="ib" id="cd">Clear cached catalogue</button></div></section></div></main>`}
 A.innerHTML=h;scrollTo(0,0);if(V==='search')srch();if(V==='settings')lists();afterRender()}
function srch(){const t=sq.trim().toLowerCase(),o=$('#sr');if(!t){o.innerHTML='<p class="mut">Type to search your library.</p>';return}
 const has=s=>String(s).toLowerCase().includes(t),pls=[];chIds().forEach(i=>data[i].pl.forEach((p,j)=>has(p.t)&&pls.push(plCard(i,j))));
 const l=Object.values(vmap).filter(v=>has(v.t)).sort(byDate);qs.s=l.map(v=>v.id);
 o.innerHTML=sec('Channels',chIds().filter(i=>has(data[i].t)).map(chCard).join(''))+sec('Live TV',tvH(0,x=>has(x.n)))+sec('Playlists',pls.join(''))+sec('Videos',l.slice(0,gN).map(v=>card(v,'s')).join('')+more(l.length,'s'))||'<p class="mut">No results.</p>'}
function lists(){const li=(i,im,n,k,c,r)=>`<div class="li">${im?`<img src="${esc(im)}" alt="">`:''}<span>${esc(n)}</span><button class="ib" data-cy="${k}${i}">${esc(c)}</button><button class="ib" data-${r}="${i}">Remove</button></div>`;
 $('#chl').innerHTML=cfg.channels.map((c,i)=>li(i,data[c]?.i,data[c]?data[c].t+' · '+data[c].v.length+' videos':c,'c',catOf(c),'rc')).join('');
 $('#tvl').innerHTML=cfg.tvs.map((t,i)=>li(i,t.i,t.n,'t',tvCat(t),'rt')).join('')}
/* ---------- Navigation and events ---------- */
function go(v){if(v!==view){stack.push(view);if(stack.length>20)stack.shift()}view=v;gN=60;lastKey=null;render()}
function back(){if(stack.length)view=stack.pop();else if(view!=='home')view='home';else return false;gN=60;lastKey=null;render();return true}
const need=()=>cfg.key?true:(toast('Save your YouTube API key first.'),false);
document.addEventListener('click',async e=>{const t=e.target,b=t.closest('button'),d=b?b.dataset:{},id=b&&b.id;if(!b)return;
 if(d.go)return go(d.go);if(d.v)return play(d.v,qs[d.q]||[]);if(d.tv!==undefined)return playTV(+d.tv);
 if(d.back!==undefined)return back();if(d.close!==undefined)return closeP();
 if(d.more){const ids=qs[d.more]||[];lastKey=`[data-v="${ids[gN]}"]`;gN+=60;return view==='search'?(srch(),afterRender()):render()}
 if(b.classList.contains('ar')){const tr=b.parentElement.querySelector('.tr');return tr.scrollBy({left:(b.classList.contains('l')?-1:1)*tr.clientWidth*.8,behavior:'smooth'})}
 if(id==='shuf'){feat=null;return render()}
 if(d.mode){cfg.mode=d.mode;saveCfg();applyMode();lastKey=`[data-mode="${d.mode}"]`;return render()}
 if(d.cc){b.closest('section').querySelector('.cin').value=d.cc;return}
 if(d.cy){const L=choices(),i=+d.cy.slice(1);if(d.cy[0]==='c'){const c=cfg.channels[i];cfg.cats[c]=L[(L.indexOf(catOf(c))+1)%L.length]}else{const x=cfg.tvs[i];x.c=L[(L.indexOf(tvCat(x))+1)%L.length]}saveCfg();return lists()}
 if(d.rc!==undefined){const c=cfg.channels.splice(+d.rc,1)[0];delete data[c];delete cfg.cats[c];saveCfg();saveData();index();lists();return}
 if(d.rt!==undefined){cfg.tvs.splice(+d.rt,1);saveCfg();return lists()}
 if(id==='sk'){cfg.key=$('#key').value.trim();saveCfg();return toast('API key saved.')}
 if(id==='tk'){cfg.key=$('#key').value.trim();saveCfg();try{await api('channels',{part:'id',id:'UC_x5XG1OV2P6uZZ5FSM9Ttw',fields:'items/id'});toast('API key works.')}catch(x){toast('Key rejected: '+x.message)}return}
 if(id==='ac'){if(!need())return;const m=$('#chi').value.match(/UC[\w-]{22}/);if(!m)return toast('Enter a channel ID that starts with UC (24 characters).');
  const c=m[0];if(cfg.channels.includes(c))return toast('That channel is already added.');
  try{await loadChannel(c,toast);cfg.channels.push(c);const g=$('#cci').value.trim();if(g)cfg.cats[c]=g;saveCfg();$('#chi').value=$('#cci').value='';toast('Added '+data[c].t+' with '+data[c].v.length+' videos.');lists();nav()}catch(x){toast('Could not add channel: '+x.message)}return}
 if(id==='at'){if(!need())return;try{toast('Fetching live TV details…');const x=await parseTV($('#tvu').value,$('#tvn').value.trim());x.c=$('#tcc').value.trim()||'General';cfg.tvs.push(x);saveCfg();$('#tvu').value=$('#tvn').value='';toast('Added '+x.n+'.');lists();nav()}catch(x){toast(x.message)}return}
 if(id==='rf'){if(!need())return;try{for(const c of cfg.channels)await loadChannel(c,toast);toast('All channels refreshed.');lists()}catch(x){toast('Refresh failed: '+x.message)}return}
 if(id==='chh'){hist=[];pos={};ls.set('ss_hist',hist);ls.set('ss_pos',pos);if(view==='hist')render();return toast('Watch history cleared.')}
 if(id==='cd'){data={};saveData();index();return toast('Cache cleared. Use Refresh all channels to reload.')}});
document.addEventListener('input',e=>{if(e.target.id==='q'){sq=e.target.value;gN=60;srch()}});
addEventListener('scroll',()=>$('#hd').classList.toggle('s',scrollY>40));addEventListener('pagehide',savePos);
/* ---------- Remote / keyboard (D-pad) ---------- */
function keyOf(t){if(t.dataset.v)return`[data-v="${t.dataset.v}"]`;if(t.dataset.tv)return`[data-tv="${t.dataset.tv}"]`;if(t.dataset.go)return`[data-go="${t.dataset.go}"]`;if(t.dataset.more)return'[data-more]';return t.id?'#'+t.id:null}
document.addEventListener('focusin',e=>{if(!e.target.closest('#pl,#settings,.set'))lastKey=keyOf(e.target)});
function focusEl(el,quiet){if(el.closest('header')){el.focus();return}el.focus({preventScroll:true});if(quiet)return;
 if(el.closest('#hero'))scrollTo({top:0,behavior:'smooth'});else el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'})}
function afterRender(){if(document.activeElement===$('#q'))return;let el=null;try{el=lastKey&&document.querySelector(lastKey)}catch{}
 const first=!el;if(!el)el=(view==='search'&&$('#q'))||$('#hero .btn.p')||$('#app .card')||$('#app .btn')||$('#app input')||$('#nav button');if(el)focusEl(el,first)}
function dirNav(dx,dy){const els=[...document.querySelectorAll('button,input')].filter(e=>e.offsetParent&&!e.disabled&&!e.classList.contains('ar'));const a=document.activeElement;
 if(!a||!els.includes(a)){els[0]&&focusEl(els[0]);return}
 const r=a.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
 for(const e of els){if(e===a)continue;const b=e.getBoundingClientRect(),x=b.left+b.width/2,y=b.top+b.height/2;
  const p=dx?(x-cx)*dx:(y-cy)*dy,o=dx?Math.abs(y-cy):Math.abs(x-cx);if(p<4)continue;
  if(dx&&o>(r.height+b.height)/2)continue;const sc=p+o*3;if(sc<bs){bs=sc;best=e}}
 if(best)focusEl(best)}
const KM={ArrowLeft:'L',ArrowRight:'R',ArrowUp:'U',ArrowDown:'D',Enter:'OK',' ':'OK',MediaPlayPause:'PP',MediaPlay:'PP',MediaPause:'PP',MediaFastForward:'FF',MediaRewind:'RW',MediaTrackNext:'NEXT',MediaTrackPrevious:'PREV',Escape:'Back',GoBack:'Back',BrowserBack:'Back'};
const KC={19:'U',20:'D',21:'L',22:'R',23:'OK',4:'Back',85:'PP',126:'PP',127:'PP',87:'NEXT',88:'PREV',89:'RW',90:'FF',227:'RW',228:'FF'};
document.addEventListener('keydown',e=>{document.documentElement.classList.remove('m');
 const a=document.activeElement,inp=a&&a.tagName==='INPUT';let k=KM[e.key]||KC[e.keyCode];
 if(e.key==='Backspace'){if(inp)return;k='Back'}if(!k)return;
 if($('#pl').classList.contains('on')){if(!isTV()&&k!=='Back')return;e.preventDefault();pKey(k);return}
 if(k==='Back'){if(back())e.preventDefault();return}
 if(inp&&(k==='OK'||(k==='L'&&a.selectionStart>0)||(k==='R'&&a.selectionEnd<a.value.length)))return;
 const d={L:[-1,0],R:[1,0],U:[0,-1],D:[0,1]}[k];if(d&&isTV()){e.preventDefault();dirNav(d[0],d[1])}});
addEventListener('mousemove',()=>{document.documentElement.classList.add('m');if($('#pl').classList.contains('on'))showOv()});
/* ---------- Boot ---------- */
(async()=>{const q=new URLSearchParams(location.search).get('add')||'';
 [...PRESET.channels,...(q.match(/UC[\w-]{22}/g)||[])].forEach(c=>{if(!cfg.channels.includes(c))cfg.channels.push(c)});
 for(const[n,u,c]of PRESET.tvs)if(!cfg.tvs.some(t=>t.n===n)&&cfg.key){try{const t=await parseTV(u,n);t.c=c||'General';cfg.tvs.push(t)}catch(e){toast(e.message)}}
 saveCfg();index();render();
 if(cfg.key)for(const c of cfg.channels)if(!data[c]){try{await loadChannel(c,toast);render()}catch(e){toast(e.message)}}})();
</script></body></html>
